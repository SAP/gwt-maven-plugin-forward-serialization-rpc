name: build
on:
  - push
  - workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository to the runner
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - shell: bash
        run: |
          mvn --batch-mode clean install
      - name: Collect Test Reports
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Maven Tests
          path: '**/TEST-*.xml' 
          max-annotations: '0'
          reporter: java-junit
          fail-on-error: true
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: gwt-${{ github.ref }}
          release_name: ${{ github.ref }}
          draft: false
          prerelease: false
      - name: Set M2_DIR env variable
        run: echo "M2_DIR=$HOME/.m2" >> "$GITHUB_ENV"
      - name: Upload Release Asset JAR
        id: upload-release-asset-jar
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }} # This pulls from the CREATE RELEASE step above, referencing it's ID to get its outputs object, which include a `upload_url`. See this blog post for more info: https://jasonet.co/posts/new-features-of-github-actions/#passing-data-to-future-steps 
          asset_path: ${{ env.M2_DIR }}/repository/org/codehaus/mojo/gwt-maven-plugin/${{ github.ref }}/gwt-maven-plugin-${{ github.ref }}.jar
          asset_name: gwt-maven-plugin-${{ github.ref }}.jar
          asset_content_type: application/java-archive
      - name: Upload pom.xml
        id: upload-release-asset-pom-xml
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }} # This pulls from the CREATE RELEASE step above, referencing it's ID to get its outputs object, which include a `upload_url`. See this blog post for more info: https://jasonet.co/posts/new-features-of-github-actions/#passing-data-to-future-steps 
          asset_path: ${{ env.M2_DIR }}/repository/org/codehaus/mojo/gwt-maven-plugin/${{ github.ref }}/gwt-maven-plugin-${{ github.ref }}.pom
          asset_name: gwt-maven-plugin-${{ github.ref }}.pom
          asset_content_type: application/xml
